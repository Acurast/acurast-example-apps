<!doctype html>
<!--
  Mail sorter: a pixel postman drops off a bag of mail, then Laya opens one
  letter after another and files it as inbox, spam or phishing. Every mail has a
  ground-truth label, so the page also shows Laya's accuracy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Mail Sorter · Acurast</title>
<link rel="stylesheet" href="demos.css">
<style>
  #street { display: block; width: 100%; max-width: 760px; image-rendering: pixelated; border: 1px solid #333; }
  .desk { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; max-width: 1100px; }
  .letter { width: 380px; max-width: 100%; height: 250px; overflow: hidden; background: #f4ecd8; color: #2b2b2b; padding: 16px 18px;
            font: 14px Georgia, serif; line-height: 1.45; box-shadow: 4px 4px 0 #000; position: relative; }
  .letter .from { font: 12px ui-monospace, monospace; color: #555; }
  .letter .subject { font-weight: bold; font-size: 16px; margin: 6px 0 10px; }
  .letter.empty { background: #222; color: #777; font: 14px ui-monospace, monospace; display: flex; align-items: center; justify-content: center; }
  .letter .stamp { position: absolute; right: 12px; top: 10px; font: bold 18px ui-monospace, monospace; padding: 2px 8px;
                   border: 3px solid; transform: rotate(8deg); opacity: 0; }
  .letter .stamp.on { opacity: 0.9; transition: opacity 0.2s; }
  .fly { position: fixed; z-index: 10; transition: transform 0.7s ease-in, opacity 0.7s ease-in; pointer-events: none; }
  .bins { display: flex; gap: 12px; flex-wrap: wrap; }
  .bin { width: 210px; height: 420px; border: 2px dashed #444; padding: 10px; display: flex; flex-direction: column; }
  .bin h4 { margin: 0 0 8px; }
  .bin ol { margin: 0; padding-left: 18px; color: #aaa; font-size: 12px; line-height: 1.5; overflow-y: auto; flex: 1; }
  #log { height: 150px; overflow: hidden; width: 380px; max-width: 100%; }
  #status { display: inline-block; min-width: 320px; }
  .bin li.wrong { color: #e5484d; }
  .bin li.right { color: #4ade80; }
  .bin.inbox h4 { color: #7ce2a0; } .bin.spam h4 { color: #ffd60a; } .bin.phishing h4 { color: #e5484d; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .compose { max-width: 520px; }
  .compose { margin: 0 0 12px; }
  @media (max-width: 700px) { .bins { width: 100%; } .bin { flex: 1 1 30%; width: auto; min-width: 100px; height: 240px; padding: 6px; } .bin ol { padding-left: 14px; font-size: 11px; } .letter { height: 230px; font-size: 13px; } #status { min-width: 0; } }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; all demos</a>
<h3>Mail sorter: Laya reads the post</h3>
<canvas id="street" width="380" height="110"></canvas>
<div class="controls">
  <button id="deliver">Call the postman</button>
  <span id="status" class="muted">The street is quiet.</span>
</div>
<details class="compose" id="compose">
  <summary>Write your own letter</summary>
  <label>From<input id="own-from" placeholder="someone@example.com"></label>
  <label>Subject<input id="own-subject" placeholder="Anything you like"></label>
  <label>Text<textarea id="own-body" rows="4" placeholder="Try a real mail from your inbox, or try to fool Laya."></textarea></label>
  <button id="own-post">Put it in the mailbox</button>
</details>
<div class="desk">
  <div>
    <div class="letter empty" id="letter">no letter open</div>
    <div class="log" id="log"></div>
  </div>
  <div class="bins">
    <div class="bin inbox" id="bin-inbox"><h4>Inbox <span>0</span></h4><ol></ol></div>
    <div class="bin spam" id="bin-spam"><h4>Spam <span>0</span></h4><ol></ol></div>
    <div class="bin phishing" id="bin-phishing"><h4>Phishing <span>0</span></h4><ol></ol></div>
  </div>
</div>
<script src="config.js"></script>
<script src="laya.js"></script>

const pick = a => a[Math.floor(Math.random() * a.length)];
const num = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const G = {

function refillPool() {
  if (handwrittenLeft) { pool.push(...shuffle(MAILS.slice())); handwrittenLeft = false; }
  else for (let i = 0; i < 12; i++) pool.push(generateMail());
}
let bag = [], pool = [], sorted = 0, graded = 0, correct = 0, totalMs = 0, busy = false;

// ---------------------------------------------------------------- pixel street + postman
const cv = $('street'), g = cv.getContext('2d');
const PAL = { k: '#1a1a1a', s: '#f1c27d', b: '#2f5fb3', d: '#1f3f7a', y: '#ffd60a', r: '#b5452b', w: '#ffffff', e: '#3b2a1a' };
// Two walking frames, 12x18 px.
const POSTMAN = [[
  '....dddd....', '...dddddd...', '..kyyyyyyk..', '...ssssss...', '...sksskss..', '...ssssss...', '....seess...',
  '..bbbbbbbb..', '.bbbbbbbbbrr', '.sbbbbbbbrrr', '.sbbbbbbbrrr', '..bbbbbbbrr.', '..dddddddd..', '..dd....dd..',
  '..dd....dd..', '..dd....dd..', '..kk....kk..', '.kkk....kkk.',
], [

  '..bbbbbbbb..', '.bbbbbbbbbrr', '.sbbbbbbbrrr', '.sbbbbbbbrrr', '..bbbbbbbrr.', '..dddddddd..', '...dd..dd...',
  '...dd..dd...', '....dddd....', '....kkkk....', '...kk..kk...',
]];
function sprite(rows, x, y, flip) {
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.') return;
    g.fillStyle = PAL[ch]; g.fillRect(Math.round(x + (flip ? row.length - 1 - i : i) * 2), Math.round(y + j * 2), 2, 2);
  }));
}
function scene(px, frame, flip, envelopes) {
  g.fillStyle = '#20304a'; g.fillRect(0, 0, 380, 70);                 // sky
  g.fillStyle = '#ffd60a'; g.fillRect(330, 12, 10, 10);               // moon
  g.fillStyle = '#5b4636'; g.fillRect(250, 22, 90, 48);               // house
  g.fillStyle = '#7a2f2f'; for (let i = 0; i < 12; i++) g.fillRect(244 + i * 4, 22 - i * 1.5, 102 - i * 8, 2);
  g.fillStyle = '#ffd98a'; g.fillRect(265, 36, 14, 12); g.fillRect(310, 36, 14, 12);
  g.fillStyle = '#3a2a1f'; g.fillRect(290, 44, 14, 26);
  g.fillStyle = '#555'; g.fillRect(0, 70, 380, 40);                   // street
  g.fillStyle = '#777'; g.fillRect(0, 70, 380, 6);
  g.fillStyle = '#b5452b'; g.fillRect(222, 50, 16, 12); g.fillStyle = '#333'; g.fillRect(228, 62, 4, 12); // mailbox
  g.fillStyle = '#f4ecd8';
  for (let i = 0; i < Math.min(envelopes, 12); i++) g.fillRect(222 + (i % 4) * 5, 46 - Math.floor(i / 4) * 3, 4, 3);
  if (px !== null) sprite(POSTMAN[frame], px, 38, flip);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function postmanRun(n) {
  $('status').textContent = 'The postman is coming...';
  for (let x = -30, f = 0; x <= 196; x += 3, f++) { scene(x, (f >> 2) & 1, false, 0); await sleep(30); }
  for (let i = 1; i <= n; i++) { scene(196, 0, false, i); await sleep(140); }
  $('status').textContent = `${n} letters in the mailbox.`;
  for (let x = 196, f = 0; x >= -30; x -= 3, f++) { scene(x, (f >> 2) & 1, true, n); await sleep(30); }
  scene(null, 0, false, n);
}

// ---------------------------------------------------------------- sorting
// Short descriptions sort better than long ones: on a Pixel 7a these got 33 of the 40
// example mails right (the longer ones 25) with 20% fewer tokens.
const FOLDERS = {
  inbox: 'genuine personal or work email',
  spam: 'advertising or junk offers',
  phishing: 'asks you to log in, pay, or confirm details via a link',
};
const STAMP = { inbox: ['INBOX', '#2e7d4f'], spam: ['SPAM', '#b58900'], phishing: ['PHISHING', '#c0392b'] };
function showLetter(m) {
  const el = $('letter');
  el.className = 'letter';
  el.innerHTML = `<div class="stamp"></div><div class="from"></div><div class="subject"></div><div class="body"></div>`;
  el.querySelector('.from').textContent = 'From: ' + m.from;
  el.querySelector('.subject').textContent = m.subject;
  el.querySelector('.body').textContent = m.body;
}
async function sortOne(m) {
  showLetter(m);
  const { answers, ms } = await Laya.ask(
    { from: m.from, subject: m.subject, body: m.body },
    { folder: { type: 'choice', instructions: 'Which folder does this email belong in?', criteria: FOLDERS } },
  );
  // Your own letters have no true label, so they don't count toward accuracy.
  const a = answers.folder, folder = a.choice, ok = m.truth ? folder === m.truth : true;
  sorted++; totalMs += ms;
  if (m.truth) { graded++; if (ok) correct++; }
  const letter = $('letter');
  letter.classList.remove('flash'); void letter.offsetWidth; letter.classList.add('flash');
  const stamp = letter.querySelector('.stamp');
  stamp.textContent = STAMP[folder][0]; stamp.style.color = stamp.style.borderColor = STAMP[folder][1]; stamp.classList.add('on');
  $('log').textContent = `Laya: ${folder} (${ms} ms, avg ${Math.round(totalMs / sorted)} ms)` +
    `${m.truth ? (ok ? '' : `   actually ${m.truth}`) : '   (your letter)'}\n` +
    `accuracy on the example mails ${correct}/${graded}\n\n${Laya.probs(a.probabilities)}`;
  await sleep(900);
  await flyTo(letter, $('bin-' + folder));
  const bin = $('bin-' + folder), li = document.createElement('li');
  li.textContent = (m.truth ? (ok ? '✓ ' : '✗ ') : 'yours: ') + m.subject + (ok ? '' : `  (was ${m.truth})`);
  if (m.truth) li.className = ok ? 'right' : 'wrong'; // own letters have no truth: stay neutral
  bin.querySelector('ol').prepend(li);
  bin.querySelector('span').textContent = bin.querySelectorAll('li').length;
  Laya.offerShare({ kicker: `A phone sorted my mail: "${m.subject}"`, big: folder.toUpperCase(),
    detail: graded ? `${correct} of ${graded} example mails sorted right so far` : 'Sorted by an open AI model on a phone' }, $('log'));
}
// Animate a copy of the letter shrinking into the bin.
async function flyTo(el, bin) {
  const a = el.getBoundingClientRect(), b = bin.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  Object.assign(ghost.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', margin: 0 });
  ghost.classList.add('fly'); ghost.classList.remove('flash');
  document.body.appendChild(ghost);
  el.className = 'letter empty'; el.textContent = 'next letter...';
  await sleep(20);
  ghost.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px, ${b.top + 30 - a.top - a.height / 2}px) scale(0.1)`;
  ghost.style.opacity = '0.3';
  await sleep(720);
  ghost.remove();
}

$('deliver').onclick = async () => {
  if (busy) return;
  busy = true; $('deliver').disabled = true;
  while (pool.length < 6) refillPool();
  bag = pool.splice(0, 6);
  await postmanRun(bag.length);
  await sortBag();
};
// Your own letter jumps the queue: sorted next, or right away if the desk is idle.
$('own-post').onclick = () => {
  const m = { truth: null, from: $('own-from').value.trim() || 'anonymous@example.com',
    subject: $('own-subject').value.trim() || '(no subject)', body: $('own-body').value.trim() };
  if (!m.body) { $('status').textContent = 'Write some text first.'; return; }
  $('own-subject').value = ''; $('own-body').value = '';
  bag.unshift(m);
  scene(null, 0, false, bag.length);
  if (!busy) { busy = true; $('deliver').disabled = true; sortBag(); }
  else $('status').textContent = 'Your letter is next in line.';
};
async function sortBag() {
  try {
    while (bag.length) {
      $('status').textContent = `${bag.length} letter${bag.length > 1 ? 's' : ''} left in the mailbox.`;
      scene(null, 0, false, bag.length);
      await sortOne(bag.shift());
    }
    scene(null, 0, false, 0);
    $('status').textContent = 'Mailbox empty. Call the postman for more.';
  } catch (e) {
    $('status').textContent = 'Laya request failed: ' + e.message;
  }
  $('letter').className = 'letter empty'; $('letter').textContent = 'no letter open';
  busy = false; $('deliver').disabled = false;
}
scene(null, 0, false, 0);
</script>
